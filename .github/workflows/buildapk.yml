name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Create Web Folder
      run: |
        mkdir -p www
        cp index.html www/

    - name: Create Capacitor Config with Server Fix
      run: |
        # Yahan server configuration add ki hai jo JavaScript aur Firebase ko block hone se bachaegi
        echo '{"appId":"com.example.myttap1","appName":"MyttAp1","webDir":"www","server":{"androidScheme":"http","allowNavigation":["*"]}}' > capacitor.config.json

    - name: Install Dependencies
      run: |
        npm install
        npm install @capacitor/camera@^7.0.0

    - name: Add Android Platform
      run: npx cap add android

    - name: Add Network State Permission safely
      run: |
        node -e "
        const fs = require('fs');
        const path = 'android/app/src/main/AndroidManifest.xml';
        if (fs.existsSync(path)) {
          let content = fs.readFileSync(path, 'utf8');
          if (!content.includes('ACCESS_NETWORK_STATE')) {
            content = content.replace('</manifest>', '    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n</manifest>');
            fs.writeFileSync(path, content, 'utf8');
            console.log('Permission added successfully!');
          }
        } else {
          console.log('Manifest file not found at expected path');
        }
        "

    - name: Inject Camera Permissions into Android Manifest
      run: |
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        PERMISSIONS="<uses-permission android:name=\"android.permission.CAMERA\" />\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />"
        sed -i "s|<application|$PERMISSIONS\n    <application|g" $MANIFEST_PATH

    - name: Sync Android
      run: npx cap sync android

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
