```yaml
name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Web App
        run: |
          mkdir -p www
          cp "index.html" www/index.html
          python3 - <<'PY'
          p="www/index.html"
          s=open(p,encoding="utf-8").read()
          debug='''<script>
          (function(){
            function showError(title,msg){
              var d=document.getElementById("__debug_error__");
              if(!d){
                d=document.createElement("div");
                d.id="__debug_error__";
                d.style="position:fixed;z-index:999999;top:0;left:0;right:0;background:#300;color:#fff;padding:15px;font:14px monospace;white-space:pre-wrap;max-height:90vh;overflow:auto;border:3px solid red;";
                document.documentElement.appendChild(d);
              }
              d.innerText+="\\n\\n"+title+"\\n"+msg;
            }
            window.addEventListener("error",function(e){
              showError("❌ JavaScript ERROR",
                "Message: "+(e.message||"Unknown")+
                "\\nFile: "+(e.filename||"Unknown")+
                "\\nLine: "+(e.lineno||"")+" Col: "+(e.colno||""));
            });
            window.addEventListener("unhandledrejection",function(e){
              var r=e.reason;
              showError("❌ UNHANDLED PROMISE",
                r&&(r.stack||r.message)?(r.stack||r.message):String(r));
            });
            window.addEventListener("DOMContentLoaded",function(){
              window.__APP_STARTED__=true;
            });
            setTimeout(function(){
              if(!window.__APP_STARTED__)showError("❌ APP START ERROR","HTML/JavaScript start nahi hua.");
            },10000);
          })();
          </script>'''
          s=s.replace("<head>","<head>"+debug,1)
          open(p,"w",encoding="utf-8").write(s)
          PY

      - name: Create package
        run: |
          npm init -y
          npm install @capacitor/core@^7.4.2 @capacitor/cli@^7.4.2 @capacitor/android@^7.4.2

      - name: Capacitor Config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId":"com.example.myttap",
            "appName":"MyttAp",
            "webDir":"www",
            "server":{
              "androidScheme":"https"
            }
          }
          EOF

      - name: Add Android
        run: npx cap add android

      - name: Android Permissions
        run: |
          python3 - <<'PY'
          p="android/app/src/main/AndroidManifest.xml"
          s=open(p).read()
          permissions=[
            '<uses-permission android:name="android.permission.INTERNET"/>',
            '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>',
            '<uses-permission android:name="android.permission.CAMERA"/>'
          ]
          for x in permissions:
            if x not in s:
              s=s.replace("<application",x+"\n    <application",1)
          open(p,"w").write(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
```
