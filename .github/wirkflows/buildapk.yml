name: Build Android APK From Single HTML

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Capacitor and Plugins
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/camera

    - name: Initialize Capacitor Project
      run: |
        npx cap init "My Firebase App" "com.example.firebaseapp" --web-dir=.

    - name: Add Android Platform
      run: npx cap add android

    - name: Inject Camera Permissions into Android Manifest
      run: |
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        PERMISSIONS="<uses-permission android:name=\"android.permission.CAMERA\" />\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />"
        # Manifest file me application tag ke theek pehle permissions inject karne ke liye
        sed -i "s|<application|$PERMISSIONS\n    <application|g" $MANIFEST_PATH

    - name: Sync Web Assets (index.html) to Android
      run: npx cap sync android

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-firebase-camera-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
