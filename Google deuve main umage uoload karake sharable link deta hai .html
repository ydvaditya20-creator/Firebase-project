<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instant Transaction Manager (Background Async Sync)</title>
<script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>


  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 30px; background-color: #f7f9fc; color: #333; }
    .container { max-width: 1000px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2, h3 { color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
    .form-group { display: flex; gap: 15px; margin-bottom: 20px; background: #edf2f7; padding: 15px; border-radius: 6px; align-items: flex-end; }
    .input-field { display: flex; flex-direction: column; flex: 1; }
    .input-field label { margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #4a5568; }
    .input-field input { padding: 8px; border: 1px solid #cbd5e0; border-radius: 4px; font-size: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
    th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; vertical-align: top; }
    th { background-color: #edf2f7; color: #4a5568; }
    tr:nth-child(even) { background-color: #f8fafc; }
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
    .modal-content { background-color: white; margin: 10% auto; padding: 25px; border-radius: 8px; width: 50%; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    .close { float: right; font-size: 28px; cursor: pointer; color: #aaa; }
    .close:hover { color: black; }
    .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
    .btn-add { background-color: #2b6cb0; color: white; }
    .btn-edit { background-color: #3182ce; color: white; margin-right: 5px; }
    .btn-delete { background-color: #e53e3e; color: white; }
    .btn-upload { background-color: #38a169; color: white; margin-top: 10px; width: 100%; }
    .doc-container { display: flex; flex-direction: column; gap: 15px; margin-top: 10px; }
    .iframe-box { border: 1px solid #cbd5e0; border-radius: 4px; overflow: hidden; padding: 5px; background: #fff; }
    .no-doc { color: #a0aec0; font-style: italic; font-size: 13px; }
    .status-msg { margin-top: 10px; font-weight: bold; color: #2f855a; text-align: center; }
    .badge-process { background-color: #feebc8; color: #c05621; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; display: inline-block; }
    .badge-drive { background-color: #c6f6d5; color: #22543d; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; display: inline-block; }
  </style>
</head>
<body>

<div class="container">
  <h2>Instant Transaction Manager (Background Storage Engine)</h2>
  
  <!-- DATA ENTRY FORM -->
  <h3>1. Add New Transaction</h3>
  <div class="form-group">
    <div class="input-field">
      <label for="txDescription">Description</label>
      <input type="text" id="txDescription" placeholder="Office Rent">
    </div>
    <div class="input-field">
      <label for="txAmount">Amount (₹)</label>
      <input type="number" id="txAmount" placeholder="12000">
    </div>
    <button id="addBtn" class="btn btn-add">Save Transaction</button>
  </div>
  
  <!-- LIVE TABLE -->
  <h3>2. Transactions List</h3>
  <table>
    <thead>
      <tr>
        <th>Description</th>
        <th>Amount</th>
        <th>Manual Documents (Smart Dynamic Engine)</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="transactionTableBody">
      <!-- Live Sync rows via JavaScript -->
    </tbody>
  </table>
</div>

<!-- EDIT MODE MODAL -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <span id="closeModalBtn" class="close">&times;</span>
    <h3>Instant Edit & Attach Bills</h3>
    <hr style="border: 1px solid #ecf0f1;">
    
    <div style="margin: 15px 0;">
      <p><b>Transaction ID:</b> <span id="modalTxId"></span></p>
      <div class="input-field" style="margin-bottom: 10px;">
        <label for="modalEditDesc">Update Description</label>
        <input type="text" id="modalEditDesc">
      </div>
      <div class="input-field">
        <label for="modalEditAmount">Update Amount (₹)</label>
        <input type="number" id="modalEditAmount">
      </div>
    </div>
    
    <label for="modalFileInput"><b>Select Multiple Bills (Instant Save):</b></label><br><br>
    <input type="file" id="modalFileInput" accept="image/*,application/pdf" multiple>
    
    <button id="uploadBtn" class="btn btn-upload">Save Everything Instantly</button>
    <div id="modalStatus" class="status-msg"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, push, update, remove, query, onValue,limitToLast, onChildAdded, onChildChanged, onChildRemoved ,get} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyDPcVvNNJZRVGF9SESynXtsZYwdJXB7J8U",
    authDomain: "shemacc-3ccac.firebaseapp.com",
    databaseURL: "https://shemacc-3ccac-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shemacc-3ccac",
    storageBucket: "shemacc-3ccac.firebasestorage.app",
    messagingSenderId: "307019636811",
    appId: "1:307019636811:web:8f6ee756dbb7e756e8edce"
};

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  let currentEditingId = null;

  // 1. CREATE ACTION
  document.getElementById('addBtn').addEventListener('click', () => {
    const desc = document.getElementById('txDescription').value.trim();
    const amount = document.getElementById('txAmount').value.trim();
    if (!desc || !amount) return;

    push(ref(db, 'transactions'), {
      description: desc,
      amount: parseFloat(amount),
      billLinks: []
    }).then(() => {
      document.getElementById('txDescription').value = "";
      document.getElementById('txAmount').value = "";
    });
  });

  // 2. READ (Smart Render Engine: Checks Base64 vs Cloud Drive Link)
  onValue(ref(db, 'transactions'), (snapshot) => {
    const tableBody = document.getElementById('transactionTableBody');
    tableBody.innerHTML = "";
    const data = snapshot.val();
    if(!data) {
      tableBody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>No records.</td></tr>";
      return;
    }

    for (let id in data) {
      const tx = data[id];
      let docHtml = `<span class="no-doc">No bills attached</span>`;

      if(tx.billLinks && tx.billLinks.length > 0) {
        docHtml = `<details><summary>📄 View Receipts (${tx.billLinks.length})</summary><div class="doc-container">`;
        
        tx.billLinks.forEach((link, index) => {
          // Check: Agar item local base64 cache image hai
          if(link.indexOf("data:image") === 0) {
            docHtml += `
              <div class="iframe-box">
                <span class="badge-process">⚡ Uploading to Drive (Local Cache)</span><br>
                <img src="${link}" style="width:100%; max-height:180px; object-fit:contain; border-radius:4px; margin-top:5px;">
              </div>`;
          } else {
            // Agar permanent Drive cloud link ban chuka hai
            docHtml += `
              <div class="iframe-box">
                <span class="badge-drive">☁ Safe Cloud Link</span><br>
                <iframe src="${link}" width="100%" height="180" style="border:none; margin-top:5px;"></iframe>
              </div>`;
          }
        });
        docHtml += `</div></details>`;
      }

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><b>${tx.description}</b></td>
        <td>₹${tx.amount}</td>
        <td>${docHtml}</td>
        <td>
          <button class="btn btn-edit" data-id="${id}">Edit Mode</button>
          <button class="btn btn-delete" data-id="${id}">Delete</button>
        </td>`;
      tableBody.appendChild(tr);
    }
  });

  // ROUTER BUTTON CONTROLS
  document.getElementById('transactionTableBody').addEventListener('click', (e) => {
    const id = e.target.getAttribute('data-id');
    if(!id) return;
    if(e.target.classList.contains('btn-edit')) openEditModal(id);
    if(e.target.classList.contains('btn-delete')) {
      if(confirm("Are you sure?")) remove(ref(db, `transactions/${id}`));
    }
  });

    async function openEditModal(id) {
    currentEditingId = id;
    document.getElementById('modalTxId').innerText = id;
    document.getElementById('modalStatus').innerText = "";
    document.getElementById('modalFileInput').value = "";
    const snapshot = await get(ref(db, `transactions/${id}`));
    if(snapshot.exists()) {
      document.getElementById('modalEditDesc').value = snapshot.val().description || "";
      document.getElementById('modalEditAmount').value = snapshot.val().amount || "";
    }
    document.getElementById('editModal').style.display = 'block';
  }

  document.getElementById('closeModalBtn').addEventListener('click', () => {
    document.getElementById('editModal').style.display = 'none';
  });

  // 3. INSTANT UPDATE: WhatsApp की तरह कंप्रेस करके Base64 Firebase में सेव करेगा
  document.getElementById('uploadBtn').addEventListener('click', async () => {
    const fileInput = document.getElementById('modalFileInput');
    const statusDiv = document.getElementById('modalStatus');
    const uploadBtn = document.getElementById('uploadBtn');
    const files = fileInput.files;
    
    if (files.length === 0) {
      statusDiv.innerHTML = "कृपया पहले फाइल चुनें।";
      return;
    }

    uploadBtn.disabled = true;
    statusDiv.innerHTML = "WhatsApp की तरह फोटो छोटी की जा रही है...";
    let localBase64Array = [];

    try {
      for (let i = 0; i < files.length; i++) {
        // यहाँ नया और सुरक्षित कंप्रेशन फंक्शन कॉल हो रहा है
        const compressedData = await convertFileToBase64Secure(files[i]);
        localBase64Array.push(compressedData);
      }

      statusDiv.innerHTML = "Firebase में सेव किया जा रहा है...";
      const specificTxRef = ref(db, `transactions/${currentEditingId}`);
      const snapshot = await get(specificTxRef);
      const txData = snapshot.val() || {};
      const existingLinks = txData.billLinks || [];
      let combinedLinks = existingLinks.concat(localBase64Array);

      await update(specificTxRef, {
        description: document.getElementById('modalEditDesc').value.trim(),
        amount: parseFloat(document.getElementById('modalEditAmount').value.trim()),
        billLinks: combinedLinks
      });

      statusDiv.innerHTML = "✓ Saved instantly! Drive sync running in background.";
      setTimeout(() => {
        uploadBtn.disabled = false;
        document.getElementById('editModal').style.display = 'none';
      }, 1500);

    } catch (error) {
      console.error(error);
      statusDiv.innerHTML = "<span style='color:red;'>⚠️ एरर आया! दोबारा कोशिश करें।</span>";
      uploadBtn.disabled = false;
    }
  });

  // नया सुरक्षित कंप्रेशन इंजन (यह 2GB RAM वाले फोन को कभी क्रैश नहीं होने देगा)
  function convertFileToBase64Secure(file) {
    return new Promise(async (resolve, reject) => {
      // अगर फाइल इमेज है तो उसे WhatsApp की तरह छोटा करो
      if (file.type.startsWith('image/')) {
        const options = {
          maxSizeMB: 0.2,          // फोटो को मात्र 200KB का बना देगा (डेटाबेस के लिए बेस्ट)
          maxWidthOrHeight: 600,   // आपके पुराने 500px के करीब (600px सेट किया है)
          useWebWorker: true       // बैकग्राउंड थ्रेड इस्तेमाल करेगा ताकि RAM फ्री रहे
        };

        try {
          // बिना FileReader के सीधे फाइल को कंप्रेस करें
          const compressedBlob = await imageCompression(file, options);
          
          // अब छोटी हो चुकी फाइल का Base64 बनाएं (यह रैम क्रैश नहीं करेगा)
          const reader = new FileReader();
          reader.readAsDataURL(compressedBlob);
          reader.onloadend = () => {
            resolve(reader.result); // कंप्रेस्ड Base64 रिटर्न करेगा
          };
        } catch (err) {
          reject(err);
        }
      } else {
        // अगर इमेज नहीं है (जैसे PDF), तो सामान्य रूप से आगे बढ़ाएं
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onloadend = () => resolve(reader.result);
      }
    });
  }

</script>
</body>
</html>
