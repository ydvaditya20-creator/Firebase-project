<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Advanced Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>

<style>

        :root{--primary:#4f46e5;--success:#16a34a;--danger:#dc2626;--bg:#f8fafc;--card:#ffffff;--text:#1e293b}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);margin:0;padding:12px}
.container{max-width:1300px;margin:0 auto}
.status{background:#dcfce7;color:#15803d;padding:10px;border-radius:6px;margin-bottom:15px;font-weight:600;text-align:center;font-size:14px}
.card{background:var(--card);border-radius:12px;padding:15px;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);margin-bottom:15px}
.flex-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;gap:10px}
.switch-container{display:flex;align-items:center;gap:10px;font-weight:bold;font-size:14px}
.switch{position:relative;display:inline-block;width:50px;height:28px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#ccc;transition:.4s;border-radius:28px}
.slider:before{position:absolute;content:"";height:20px;width:20px;left:4px;bottom:4px;background-color:#fff;transition:.4s;border-radius:50%}
input:checked+.slider{background-color:var(--primary)}
input:checked+.slider:before{transform:translateX(22px)}
.voucher-header{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:15px;background:#f1f5f9;padding:12px;border-radius:8px}
.entry-row{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:15px;padding-bottom:15px;border-bottom:1px dashed #cbd5e1;position:relative}
label{font-size:12px;font-weight:600;margin-bottom:4px}
.form-group{display:flex;flex-direction:column;position:relative}
input,select,textarea{padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:14px;width:100%;box-sizing:border-box}
textarea{resize:vertical;min-height:50px}
button{background:var(--primary);color:#fff;border:none;padding:10px 16px;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px}
button:disabled{opacity:.5}
.btn-add-row{background:#0284c7;margin-bottom:12px;padding:6px 12px;font-size:13px}
.btn-remove-row{background:var(--danger);padding:8px;font-size:14px;height:38px}
.table-responsive{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:15px}
table{width:100%;border-collapse:collapse;text-align:left}
th,td{padding:10px;border-bottom:1px solid #e2e8f0;font-size:13px;vertical-align:top;white-space:nowrap}
th{background:#f1f5f9}
.btn-sm{padding:5px 8px;font-size:12px;margin-right:4px;border:none;border-radius:4px;color:#fff;cursor:pointer;display:inline-block;margin-bottom:4px}
.btn-edit{background:#eab308}
.btn-delete{background:var(--danger)}
.btn-print{background:#64748b}
.btn-save{background:var(--success)}
.btn-cancel{background:#94a3b8}
.suggestions{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #cbd5e1;border-radius:6px;max-height:150px;overflow-y:auto;z-index:99;box-shadow:0 4px 6px rgba(0,0,0,0.1)}
.suggestion-item{padding:8px 12px;cursor:pointer;color:#334155;font-size:13px}
.suggestion-item:hover{background:#f1f5f9}
.hidden{display:none}
.table-title{font-size:16px;font-weight:bold;margin-top:0;color:var(--primary)}
.badge{padding:3px 6px;border-radius:4px;font-size:10px;font-weight:bold;text-transform:uppercase}
.badge-dr{background:#dbeafe;color:#1e40af}
.badge-cr{background:#fee2e2;color:#991b1b}
.totals-box{text-align:right;margin-top:12px;font-weight:bold;font-size:14px}
.error-msg{color:var(--danger);font-size:12px;font-weight:bold;margin-top:5px}
@media(min-width:768px){
  body{padding:20px}
  .card{padding:20px}
  .voucher-header{grid-template-columns:200px 200px 1fr}
  .entry-row{grid-template-columns:120px 1fr 200px 50px;border-bottom:none;margin-bottom:10px;padding-bottom:0}
  .totals-box{font-size:15px;padding-right:60px}
}

    </style>
</head>
<body>

<div class="container">
    <h2>⚡ Multi-Line Ledger Dashboard</h2>
    <div id="authStatus" class="status">Connecting securely...</div>

    <!-- MAIN CONSOLIDATED INPUT FORM -->
    <div class="card">
        <div class="flex-header">
            <h3>📝 New Multi-Line Journal Voucher</h3>
            <div class="switch-container">
                <span>🏠 Natwa</span>
                <label class="switch">
                    <input type="checkbox" id="tableToggle">
                    <span class="slider"></span>
                </label>
                <span>🏢 Basahi</span>
            </div>
        </div>

        <form id="txnForm">
            <!-- Voucher Settings -->
            <div class="voucher-header">
                <div class="form-group">
                    <label>Voucher Auto No</label>
                    <input type="text" id="vouchNo" readonly style="font-weight: bold; color: var(--primary);">
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="vouchDate" required>
                </div>
            </div>

            <!-- Double Entry Multiple Accounts Rows Container -->
            <div id="entriesContainer"></div>

            <button type="button" class="btn-add-row" id="addAccRowBtn">➕ Add Row (Dr/Cr)</button>

            <!-- Multi-line Narration Field -->
            <div class="form-group" style="margin-top: 15px;">
                <label>Multi-line Narration / Remarks</label>
                <textarea id="narration" autocomplete="off" placeholder="Write comprehensive multiline details..." required></textarea>
                <div id="narrationSuggestions" class="suggestions hidden"></div>
            </div>

            <!-- Totals & Validation Verification Block -->
            <div class="totals-box">
                Total Dr: ₹<span id="totalDrLabel">0.00</span> | Total Cr: ₹<span id="totalCrLabel">0.00</span>
                <div id="validationError" class="error-msg"></div>
            </div>

            <div style="text-align: right; margin-top: 15px;">
                <button type="submit" id="submitBtn" disabled style="padding: 12px 30px; font-size: 15px;">Save Voucher Entry</button>
            </div>
        </form>
        <div id="speedLog" style="margin-top:10px; font-size:13px; color:#666;"></div>
    </div>
<!-- तारीख फ़िल्टर बार और न्यू टैब बटन -->
<div class="filter-container" style="display: flex; gap: 15px; align-items: center; margin-bottom: 15px; padding: 10px; background: #f5f5f5; border-radius: 6px;">
    <div>
        <label style="font-weight: bold; font-size: 13px;">From Date: </label>
        <input type="date" id="filterFromDate">
    </div>
    <div>
        <label style="font-weight: bold; font-size: 13px;">To Date: </label>
        <input type="date" id="filterToDate">
    </div>
    <!-- Filter बटन दबाते ही डेटाबेस से डेटा फेच होगा -->
    <button onclick="applyDateFilterAndListen()" style="padding: 6px 12px; background: #28a745; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px;">
        🔍 Filter Data
    </button>
    <button onclick="openTableInNewTab()" style="margin-left: auto; padding: 6px 12px; background: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px;">
        🔗 Open in New Tab
    </button>
</div>



    <!-- SEPARATE DASHBOARD LEDGER TABLES -->
    <div class="card" id="natwaCard">
        <p class="table-title">🏠 Natwa Ledger Records</p>
        <table>
            <thead>
                <tr>
                    <th>Txn ID</th>
                    <th>Voucher No</th>
                    <th>Date</th>
                    <th>Accounts</th>
                    <th>Narration</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="natwaTableBody"></tbody>
        </table>
    </div>

    <div class="card" id="basahiCard">
        <p class="table-title">🏢 Basahi Ledger Records</p>
        <table>
            <thead>
                <tr>
                    <th>Txn ID</th>
                    <th>Voucher No</th>
                    <th>Date</th>
                    <th>Accounts</th>
                    <th>Narration</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="basahiTableBody"></tbody>
        </table>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, push, orderByChild,startAt,endAt, update, remove, query, limitToLast, onChildAdded, onChildChanged, onChildRemoved } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyDPcVvNNJZRVGF9SESynXtsZYwdJXB7J8U",
    authDomain: "shemacc-3ccac.firebaseapp.com",
    databaseURL: "https://shemacc-3ccac-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shemacc-3ccac",
    storageBucket: "shemacc-3ccac.firebasestorage.app",
    messagingSenderId: "307019636811",
    appId: "1:307019636811:web:8f6ee756dbb7e756e8edce"
};



const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let uniqueAccounts = new Set();
let uniqueNarrations = new Set();
let maxNatwaVoucher = 0;
let maxBasahiVoucher = 0;
// Local memory cache to revert inline edits on cancel
let cacheRowData = {}; 

const submitBtn = document.getElementById("submitBtn");
const tableToggle = document.getElementById("tableToggle");
const entriesContainer = document.getElementById("entriesContainer");
const totalDrLabel = document.getElementById("totalDrLabel");
const totalCrLabel = document.getElementById("totalCrLabel");
const validationError = document.getElementById("validationError");

document.getElementById("vouchDate").value = new Date().toISOString().split('T')[0];

window.calculateFormTotals = function() {
    let totalDr = 0, totalCr = 0;
    document.querySelectorAll(".entry-row").forEach(row => {
        const type = row.querySelector(".row-type").value;
        const amt = parseFloat(row.querySelector(".row-amount").value) || 0;
        if(type === "Dr") totalDr += amt; else totalCr += amt;
    });
    totalDrLabel.innerText = totalDr.toFixed(2);
    totalCrLabel.innerText = totalCr.toFixed(2);
    
    if(totalDr.toFixed(2) !== totalCr.toFixed(2)) {
        validationError.innerText = "⚠️ Total Debits must exactly equal Total Credits!";
        submitBtn.disabled = true;
    } else if(totalDr === 0) {
        validationError.innerText = "⚠️ Total Amount cannot be zero.";
        submitBtn.disabled = true;
    } else {
        validationError.innerText = "";
        submitBtn.disabled = false;
    }
};

signInAnonymously(auth);

onAuthStateChanged(auth, (user) => {
    if (user) {
        document.getElementById("authStatus").innerText = "🔒 Secure Tally Multi-Line Engine Active";
        if(submitBtn) submitBtn.disabled = false;
        setupNarrationSuggestions();
        initRealtimeListeners();
        
    }
});

function generateTxnData() {
    const d = new Date();
    const currentYearShort = String(d.getFullYear()).slice(-2); 
    
    const timePart = String(d.getHours()).padStart(2,'0') + 
                     String(d.getMinutes()).padStart(2,'0') + 
                     String(d.getSeconds()).padStart(2,'0') + "-" + 
                     String(d.getMilliseconds()).padStart(3,'0');
    
    const isBasahi = tableToggle.checked;
    const prefix = isBasahi ? "B" : "N";
    const nextNum = isBasahi ? (maxBasahiVoucher + 1) : (maxNatwaVoucher + 1);
    
    const txnId = `TXN-${timePart}`;
    const vouchNo = `${prefix}-${currentYearShort}-${String(nextNum).padStart(4, '0')}`;
    
    return { txnId, vouchNo };
}

function refreshVoucherField() {
    const data = generateTxnData();
    document.getElementById("vouchNo").value = data.vouchNo;
}
setInterval(refreshVoucherField, 500);
tableToggle.addEventListener("change", refreshVoucherField);

window.removeRow = function(rowId) {
    const row = document.getElementById(rowId);
    if(row) {
        row.remove();
        window.calculateFormTotals();
    }
};

let rowCounter = 0;
function addAccountRow(type = "Dr", accountName = "", amount = "") {
    rowCounter++;
    const rowId = `entry-row-${rowCounter}`;
    
    const div = document.createElement("div");
    div.className = "entry-row";
    div.id = rowId;
    div.innerHTML = `
        <div>
            <select class="row-type" onchange="window.calculateFormTotals()">
                <option value="Dr" ${type === "Dr" ? "selected" : ""}>Dr</option>
                <option value="Cr" ${type === "Cr" ? "selected" : ""}>Cr</option>
            </select>
        </div>
        <div style="position:relative;">
            <input type="text" class="row-account" value="${accountName}" placeholder="Account..." autocomplete="off" required>
            <div class="suggestions hidden"></div>
        </div>
        <div>
            <input type="number" step="0.01" class="row-amount" value="${amount}" placeholder="Amount ₹" oninput="window.calculateFormTotals()" required>
        </div>
        <div>
            <button type="button" class="btn-remove-row" onclick="window.removeRow('${rowId}')">❌</button>
        </div>
    `;
    entriesContainer.appendChild(div);
    setupAccountRowSuggestions(div.querySelector(".row-account"), div.querySelector(".suggestions"));
    window.calculateFormTotals();
}

addAccountRow("Dr");
addAccountRow("Cr");
document.getElementById("addAccRowBtn").addEventListener("click", () => addAccountRow("Dr"));

document.getElementById("txnForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    window.calculateFormTotals();
    if(submitBtn.disabled) return;
    
    submitBtn.disabled = true;
    const targetBranch = tableToggle.checked ? "basahi" : "natwa";
    const dbRef = ref(db, `transactions/${targetBranch}`);
    const timing = generateTxnData();
    
    const items = [];
    document.querySelectorAll(".entry-row").forEach(row => {
        items.push({
            type: row.querySelector(".row-type").value,
            account: row.querySelector(".row-account").value.trim(),
            amount: parseFloat(row.querySelector(".row-amount").value).toFixed(2)
        });
        uniqueAccounts.add(row.querySelector(".row-account").value.trim());
    });

    const multiLineNarration = document.getElementById("narration").value.trim();
    uniqueNarrations.add(multiLineNarration);

    try {
        await push(dbRef, {
            txn_id: timing.txnId,
            voucher_no: timing.vouchNo,
            date: document.getElementById("vouchDate").value,
            entries: items,
            narration: multiLineNarration,
            billLinks: [],
            timestamp: Date.now()
        });
        document.getElementById("speedLog").innerText = `⚡ Voucher ${timing.vouchNo} Synced Successfully!`;
        entriesContainer.innerHTML = "";
        addAccountRow("Dr"); 
        addAccountRow("Cr");
        document.getElementById("narration").value = "";
    } catch (err) { alert("Error: " + err.message); }
    submitBtn.disabled = false;
});
function parseVoucherNumber(vouchStr) {
    if(!vouchStr) return 0;
    const parts = vouchStr.split('-');
    if(parts.length >= 3) {
        return parseInt(parts[2]) || 0;
    }
    return 0;
}

// एक्टिव Firebase लिसनर्स को ट्रैक करने के लिए ग्लोबल ऑब्जेक्ट
// एक्टिव Firebase लिसनर्स को ट्रैक करने के लिए ग्लोबल ऑब्जेक्ट
let activeListeners = {};

// 1. पेज लोड होने का लॉजिक
document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    let fromParam = urlParams.get('from');
    let toParam = urlParams.get('to');

    if (!fromParam || !toParam) {
        // डिफ़ॉल्ट रूप से पिछले 2 दिन
        const toDate = new Date(); 
        const fromDate = new Date();
        fromDate.setDate(toDate.getDate() - 1); 

        fromParam = fromDate.toISOString().split('T')[0];
        toParam = toDate.toISOString().split('T')[0];
    }

    document.getElementById("filterFromDate").value = fromParam;
    document.getElementById("filterToDate").value = toParam;

    // 🛠️ टॉगल स्विच का इवेंट लिसनर
    const toggleInput = document.getElementById("tableToggle");
    if (toggleInput) {
        toggleInput.addEventListener("change", () => {
            // जैसे ही टॉगल बदलेगा, यह टेबल को भी शो/हाइड करेगा और डेटा भी लोड करेगा
            applyDateFilterAndListen();
        });
    }

    // पहली बार डेटा लोड करें
    applyDateFilterAndListen();
});

// 2. फ़िल्टर और टेबल शो/हाइड करने का मुख्य फंक्शन
function applyDateFilterAndListen() {
    const fromVal = document.getElementById("filterFromDate").value;
    const toVal = document.getElementById("filterToDate").value;

    if (!fromVal || !toVal) return;

    const toggleInput = document.getElementById("tableToggle");
    if (!toggleInput) return;
    
    // HTML के अनुसार: Checked = Basahi (🏢), Unchecked = Natwa (🏠)
    const activeBranch = toggleInput.checked ? 'basahi' : 'natwa'; 
    const inactiveBranch = toggleInput.checked ? 'natwa' : 'basahi';

    // 🛠️ विजुअल फिक्स: एक्टिव टेबल को दिखाएं और इनएक्टिव टेबल को छुपाएं
    // (नोट: यदि आपकी पूरी <table> की ID अलग है, तो आप 'TableBody' की जगह अपनी मुख्य Table ID का उपयोग भी कर सकते हैं)
    const activeTable = document.getElementById(`${activeBranch}TableBody`);
    const inactiveTable = document.getElementById(`${inactiveBranch}TableBody`);
    
    // अगर आप पूरी Table को हाइड करना चाहते हैं, तो सुनिश्चित करें कि आपकी टेबल या उसके पैरेंट कंटेनर पर ये IDs हों।
    // यहाँ हम इनके बॉडी कंटेनर को मैनेज कर रहे हैं:
    if (activeTable) {
        // अगर आपने पूरे table एलिमेंट को हाइड करना है, तो .closest('table') का उपयोग करें
        const mainTable = activeTable.closest('table');
        if (mainTable) mainTable.style.display = ""; 
    }
    if (inactiveTable) {
        const mainTable = inactiveTable.closest('table');
        if (mainTable) mainTable.style.display = "none";
    }

    // A. इनएक्टिव ब्रांच का Firebase कनेक्शन तुरंत कट (Off) करें
    if (activeListeners[inactiveBranch]) {
        activeListeners[inactiveBranch](); 
        delete activeListeners[inactiveBranch];
    }

    // B. एक्टिव टेबल का पुराना डेटा साफ करें ताकि नया फ्रेश डेटा लोड हो सके
    if (activeTable) activeTable.innerHTML = ""; 

    // C. एक्टिव ब्रांच का कोई पुराना लिसनर चल रहा है, तो उसे भी बंद करें
    if (activeListeners[activeBranch]) {
        activeListeners[activeBranch]();
    }

    console.log(`Switched to: ${activeBranch}. Fetching data from ${fromVal} to ${toVal}`);

    // D. 🚀 Firebase से रेंज क्वेरी
    const branchRef = query(
        ref(db, `transactions/${activeBranch}`),
        orderByChild('date'),
        startAt(fromVal),
        endAt(toVal)
    );

        const unsubscribeAdded = onChildAdded(branchRef, (snapshot) => {
        const data = snapshot.val();
        if(!data) return;

        const vNum = parseVoucherNumber(data.voucher_no);
        if(activeBranch === 'natwa' && vNum > maxNatwaVoucher) maxNatwaVoucher = vNum;
        if(activeBranch === 'basahi' && vNum > maxBasahiVoucher) maxBasahiVoucher = vNum;

        if(data.entries) data.entries.forEach(e => uniqueAccounts.add(e.account));
        uniqueNarrations.add(data.narration);

        // 1. मुख्य डेटा रो (Transaction Row)
        const row = document.createElement("tr");
        row.id = `row-${snapshot.key}`;
        row.dataset.key = snapshot.key;
        row.dataset.branch = activeBranch;

        // 2. ठीक नीचे वाली इमेज रो (Image Row)
        const imgRow = document.createElement("tr");
        imgRow.id = `row-img-${snapshot.key}`;
        imgRow.className = "image-row";

        // दोनों रो में डेटा रेंडर करें
        renderRowStandard(row, imgRow, data);

        if(activeTable) {
            // चूँकि हम insertBefore कर रहे हैं और हम चाहते हैं कि डेटा रो ऊपर रहे और इमेज रो उसके ठीक नीचे,
            // इसलिए पहले इमेज रो इन्सर्ट होगी, फिर उसके ऊपर मुख्य डेटा रो इन्सर्ट होगी।
            activeTable.insertBefore(imgRow, activeTable.firstChild);
            activeTable.insertBefore(row, activeTable.firstChild);
        }
    });

    const unsubscribeChanged = onChildChanged(branchRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        const row = document.getElementById(`row-${snapshot.key}`);
        const imgRow = document.getElementById(`row-img-${snapshot.key}`);

        if (row && imgRow) {
            renderRowStandard(row, imgRow, data);
        }
    });

    // 🔥 DELETE होने पर table से दोनों rows तुरंत हटेंगी
    const unsubscribeRemoved = onChildRemoved(branchRef, (snapshot) => {
        const row = document.getElementById(`row-${snapshot.key}`);
        const imgRow = document.getElementById(`row-img-${snapshot.key}`);

        if(row) row.remove();
        if(imgRow) imgRow.remove();

        // local cache भी हटाएँ
        delete cacheRowData[`row-${snapshot.key}`];
        delete cacheRowData[snapshot.key];
    });


activeListeners[activeBranch] = () => {
    unsubscribeAdded();
    unsubscribeChanged();
    unsubscribeRemoved();
};}

// ग्लोबल स्कोप में फंक्शंस डालें
window.applyDateFilterAndListen = applyDateFilterAndListen;

window.triggerInlineEdit = function(rowId) {

    window.editBillLinksCache[key] = data.billLinks ? [...data.billLinks] : [];

    data.entries.forEach((e, idx) => {
        editRowsHtml += `
            <div style="display:flex; gap:5px; margin-bottom:5px;">

                    <option value="Dr" ${e.type === "Dr" ? "selected" : ""}>Dr</option>

window.removeImageFromEdit = function(key, index) {
    if(window.editBillLinksCache[key]) {
        // एरे में से उस इंडेक्स की इमेज हटाएँ
        window.editBillLinksCache[key].splice(index, 1);
        
        // यूज़र इंटरफ़ेस (UI) को तुरंत अपडेट करने के लिए एलिमेंट को डिलीट करें
        const imgBox = document.getElementById(`edit-img-box-${key}-${index}`);
        if(imgBox) imgBox.remove();
        
        // यदि अब कोई भी इमेज नहीं बची तो मैसेज दिखाएँ
        const container = document.getElementById(`edit-preview-container-${key}`);
        if(container && window.editBillLinksCache[key].length === 0) {
            container.innerHTML = `<span style="font-size:11px; color:#999;">No bills attached</span>`;
        }
    }
};



window.saveInlineEdit = async function(rowId) {
    const row = document.getElementById(rowId);
    if (!row) return;

    const key = row.dataset.key;
    const branch = row.dataset.branch;
    const oldData = cacheRowData[rowId];

    if (!oldData) {
        console.error("Old row data not found:", rowId);
        return;
    }

    const types = row.querySelectorAll(`.edit-type-${key}`);
    const accounts = row.querySelectorAll(`.edit-acc-${key}`);
    const amounts = row.querySelectorAll(`.edit-amt-${key}`);

    const fileInput = document.getElementById(`edit-file-${key}`);
    const statusDiv = document.getElementById(`edit-status-${key}`);
    const saveBtn = document.getElementById(`save-btn-${key}`);

    const files = fileInput ? fileInput.files : [];

    // =====================================================
    // IMPORTANT:
    // सभी edit values को पहले सुरक्षित तरीके से पढ़ लें
    // =====================================================

    const voucherInput = document.getElementById(`edit-vouch-${key}`);
    const dateInput = document.getElementById(`edit-date-${key}`);
    const narrInput = document.getElementById(`edit-narr-${key}`);

    const voucherNo = voucherInput ? voucherInput.value.trim() : (oldData.voucher_no || "");
    const editDate = dateInput ? dateInput.value : (oldData.date || "");
    const narration = narrInput ? narrInput.value.trim() : (oldData.narration || "");

    // =====================================================
    // Entries
    // =====================================================

    const updatedEntries = [];

    let totalDr = 0;
    let totalCr = 0;

    for (let i = 0; i < types.length; i++) {

        const amt = parseFloat(amounts[i]?.value) || 0;
        const account = accounts[i]?.value.trim() || "";
        const type = types[i]?.value || "Dr";

        if (type === "Dr") {
            totalDr += amt;
        } else {
            totalCr += amt;
        }

        updatedEntries.push({
            type: type,
            account: account,
            amount: amt.toFixed(2)
        });
    }

    // =====================================================
    // Debit / Credit validation
    // =====================================================

    if (totalDr.toFixed(2) !== totalCr.toFixed(2)) {
        alert(
            "Mismatch Error:\n\n" +
            "Total Debit: " + totalDr.toFixed(2) +
            "\nTotal Credit: " + totalCr.toFixed(2)
        );
        return;
    }

    // =====================================================
    // Save button protection
    // =====================================================

    if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving...";
    }

    let localBase64Array = [];

    // =====================================================
    // New files
    // =====================================================

    if (files && files.length > 0) {

        if (statusDiv) {
            statusDiv.innerHTML =
                " कंप्रेशन चल रहा है...";
        }

        try {

            for (let i = 0; i < files.length; i++) {

                const compressedData =
                    await convertInlineFileToBase64(files[i]);

                localBase64Array.push(compressedData);
            }

            if (statusDiv) {
                statusDiv.innerHTML =
                    "डेटाबेस में सेव हो रहा है...";
            }

        } catch (err) {

            console.error("File compression error:", err);

            alert(
                "फाइल प्रोसेस करने में एरर आया: " +
                err.message
            );

            if (saveBtn) {
                saveBtn.disabled = false;
                saveBtn.textContent = "Save";
            }

            return;
        }
    }

    // =====================================================
    // Existing + New bill links
    // =====================================================

    const remainingLinks =
        window.editBillLinksCache[key] || [];

    const combinedLinks =
        remainingLinks.concat(localBase64Array);

    // =====================================================
    // Firebase Update
    // =====================================================

    try {

        await update(
            ref(db, `transactions/${branch}/${key}`),
            {
                txn_id: oldData.txn_id,

                // अब DOM से दोबारा voucher no नहीं पढ़ रहे
                voucher_no: voucherNo,

                date: editDate,

                entries: updatedEntries,

                narration: narration,

                billLinks: combinedLinks,

                timestamp:
                    oldData.timestamp || Date.now()
            }
        );

        // =================================================
        // Success
        // =================================================

        if (statusDiv) {
            statusDiv.innerHTML =
                "<span style='color:green;'>✓ Saved Successfully!</span>";
        }

        // Cache साफ करें
        delete window.editBillLinksCache[key];

        // =================================================
        // Local cache update
        // =================================================

        cacheRowData[rowId].billLinks = combinedLinks;
        cacheRowData[rowId].voucher_no = voucherNo;
        cacheRowData[rowId].date = editDate;
        cacheRowData[rowId].entries = updatedEntries;
        cacheRowData[rowId].narration = narration;

                setTimeout(() => {
            if (typeof renderRowStandard === "function") {
                // 1. rowId से मुख्य डेटा रो ढूँढें (जैसे: row-12345)
                const row = document.getElementById(rowId);
                
                // 2. उसी की इमेज रो भी ढूँढें (जैसे: row-img-12345)
                // rowId में पहले से "row-" शामिल होता है, इसलिए replace करके key निकाल रहे हैं
                const pureKey = rowId.replace("row-", "");
                const imgRow = document.getElementById(`row-img-${pureKey}`);

                if (row && imgRow) {
                    // 3. अब तीनों सही आर्गुमेंट्स पास करें: row, imgRow, और updated data
                    renderRowStandard(row, imgRow, cacheRowData[rowId]);
                } else {
                    // बैकअप: अगर DOM में रो नहीं मिली तो पेज रीलोड करें
                    location.reload();
                }
            } else {
                location.reload();
            }
        }, 800);

    } catch (err) {

        console.error("Firebase update error:", err);

        alert(
            "Failed to update entry:\n" +
            err.message
        );

        if (statusDiv) {
            statusDiv.innerHTML =
                "<span style='color:red;'>सेव फेल हुआ!</span>";
        }

        if (saveBtn) {
            saveBtn.disabled = false;
            saveBtn.textContent = "Save";
        }
    }
};

// इनलाइन एडिट के लिए सुरक्षित कंप्रेशन इंजन (इसे अपने स्क्रिप्ट में नीचे जोड़ दें)
function convertInlineFileToBase64(file) {
    return new Promise(async (resolve, reject) => {
        if (file.type.startsWith('image/')) {
            const options = {
                maxSizeMB: 2.5,          // 🌟 Quality badhane ke liye size limit ko 2.5 MB kiya (ताकि डिटेल्स मिस न हों)
                maxWidthOrHeight: 1600,  // 🌟 Dimensions ko 1600 kiya (ताकि टेक्स्ट और इमेज बिल्कुल साफ और HD दिखें)
                useWebWorker: true,
                initialQuality: 0.95     // 🌟 Compression quality ko 95% par set kiya (ताकि original quality barkarar rahe)
            };
            try {
                const compressedBlob = await imageCompression(file, options);
                const reader = new FileReader();
                reader.readAsDataURL(compressedBlob);
                reader.onloadend = () => resolve(reader.result);
            } catch (err) {
                reject(err);
            }
        } else {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onloadend = () => resolve(reader.result);
        }
    });
}

        suggestionsElement.innerHTML = "";
        if(!val) { suggestionsElement.classList.add("hidden"); return; }
        const filtered = Array.from(uniqueAccounts).filter(item => item.toLowerCase().includes(val));
        filtered.forEach(item => {
            const div = document.createElement("div"); div.className = "suggestion-item"; div.innerText = item;
            div.addEventListener("click", () => { inputElement.value = item; suggestionsElement.classList.add("hidden"); });
            suggestionsElement.appendChild(div);
        });

    });
}
